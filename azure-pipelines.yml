
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle

steps:
  - checkout: self

  - bash: |
      chmod +x ./gradlew
    displayName: 'Set Gradle Wrapper permissions'

  - task: Gradle@3
    displayName: 'Gradle Clean Build and Test'
    inputs:
      gradleWrapperFile: 'gradlew'
      tasks: 'clean build'
      publishJUnitResults: true
      testResultsFiles: '**/TEST-*.xml'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.21'
      jdkArchitectureOption: 'x64'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Kotlin Application Artifact'
    inputs:
      targetPath: '$(Build.SourcesDirectory)/app/build/libs'
      artifact: 'kotlin-app'
      publishLocation: 'pipeline'
